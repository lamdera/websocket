<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lamdera/websocket harness</title>
</head>
<body>
<div id="app"></div>
<script>
  // Which compiled bundle to load: /dist/<version>.js, from ?v=<version>.
  var version = new URLSearchParams(location.search).get('v') || 'current';

  // Every Elm message the harness app reports, in order. Data that is not a
  // JS string (a Blob for a binary frame, say) is recorded by its type, since
  // that is a value Elm believes is a String.
  window.__events = [];

  function describe(value) {
    if (typeof value === 'string') return value;
    if (value === undefined) return { nonString: 'undefined' };
    return { nonString: Object.prototype.toString.call(value) };
  }

  function boot() {
    var app = Elm.Main.init({ node: document.getElementById('app') });
    app.ports.event.subscribe(function (e) {
      var copy = {};
      for (var k in e) copy[k] = (k === 'data' || k === 'reason') ? describe(e[k]) : e[k];
      window.__events.push(copy);
    });
    window.__send = function (cmd) { app.ports.command.send(cmd); };
  }

  var s = document.createElement('script');
  s.src = '/dist/' + version + '.js';
  s.onload = boot;
  s.onerror = function () { window.__loadError = 'could not load ' + s.src; };
  document.head.appendChild(s);
</script>
</body>
</html>
